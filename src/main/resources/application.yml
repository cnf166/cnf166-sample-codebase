spring:
  application:
    name: cnf166-sample-codebase
  profiles:
    active: @spring.profiles.active@
---
server:
  port: 8080
spring:
  config:
    activate:
      on-profile: dev
open:
  api:
    title: API document
    version: v1.0.0
    description: This is the OpenAPI swagger for some specific API endpoints
    serverUrl: http://localhost:${server.port}
    serverName: Demo Server
