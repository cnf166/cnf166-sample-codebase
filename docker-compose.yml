version: '3.9'

services:
  api-service-document:
    container_name: api-image-container
    image: api-image-demo
    ports:
      - '8080:8080'
    networks:
      - backend
  api-service-test:
    container_name: api-image-container-test
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - '8081:8080'
    networks:
      - backend

networks:
  backend:
    driver: bridge
      